name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.1 或 v0.1.1。预发布用 0.1.1-rc.1。"
        required: true
        type: string
      dry_run:
        description: "只构建并上传 Actions 产物，不创建 GitHub Release"
        required: false
        type: boolean
        default: false

# Publish jobs only read the repo. The release job writes the Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.version || 'none' }}-${{ github.event.inputs.dry_run || 'false' }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and check the version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$value" in
              *[!A-Za-z0-9._-]*)
                echo "unsafe resolver value for ${key}" >&2
                exit 1
                ;;
            esac
            case "$key" in
              tag|version|prerelease)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                printf '%s=%s\n' "$key" "$value"
                ;;
              *)
                echo "unexpected resolver output: $line" >&2
                exit 1
                ;;
            esac
          done < <(./packaging/resolve-release-version.sh)
          for key in tag version prerelease; do
            if ! grep -q "^${key}=" "$GITHUB_OUTPUT"; then
              echo "resolver did not set ${key}" >&2
              exit 1
            fi
          done

  publish:
    name: Publish ${{ matrix.sku }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest already has the VS C++ toolset Native AOT links with.
          # x64 SKUs are separate binaries. Native AOT constant-folds IsSupported,
          # so one zip cannot contain both the AVX2 and AVX-512 kernels.
          - os: windows-latest
            rid: win-x64
            isa: avx2
            sku: win-x64-avx2
          - os: windows-latest
            rid: win-x64
            isa: avx512
            sku: win-x64-avx512
          - os: ubuntu-latest
            rid: linux-x64
            isa: avx2
            sku: linux-x64-avx2
          - os: ubuntu-latest
            rid: linux-x64
            isa: avx512
            sku: linux-x64-avx512
          # macos-latest is Apple Silicon. One zip; MagikaIsa=apple-m1 keeps AdvSimd in the AOT binary.
          - os: macos-latest
            rid: osx-arm64
            isa: apple-m1
            sku: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Install Native AOT build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Require an Apple Silicon runner
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) ;;
            *)
              echo "osx-arm64 Native AOT must run on Apple Silicon; uname -m is ${arch}" >&2
              exit 1
              ;;
          esac

      - name: Native AOT publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ISA: ${{ matrix.isa }}
          SKU: ${{ matrix.sku }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          args=(
            dotnet publish src/Magika.Cli/Magika.Cli.csproj
            --configuration Release
            --runtime "$RID"
            --self-contained true
            -p:PublishAot=true
            -p:Version="$VERSION"
            -p:InformationalVersion="$TAG"
            -p:IncludeSourceRevisionInInformationalVersion=false
            -p:DebugType=none
            -p:DebugSymbols=false
            -p:NativeDebugSymbols=false
            --output "artifacts/$SKU"
          )
          # MagikaIsa is a single token. Do not pass IlcInstructionSet as a comma list;
          # MSBuild splits -p values on commas. The project maps avx2 to IlcInstructionSet=avx2,
          # avx512 to IlcInstructionSet=avx512 plus IlcMaxVectorTBitWidth=512,
          # and apple-m1 to IlcInstructionSet=apple-m1 for osx-arm64.
          if [ -n "$ISA" ] && [ "$ISA" != "none" ]; then
            args+=(-p:MagikaIsa="$ISA")
          fi
          "${args[@]}"
          if find "artifacts/$SKU" \( -iname '*.pdb' -o -iname '*.dbg' \) | grep -q .; then
            echo "publish directory contains debug symbols" >&2
            exit 1
          fi

      - name: Sign the Apple Silicon binary
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          bin=artifacts/osx-arm64/Magika.Cli
          chmod +x "$bin"
          if ! codesign --verify "$bin" >/dev/null 2>&1; then
            codesign --force --sign - "$bin"
          fi
          file "$bin" | grep -Eq 'arm64|ARM64'

      # apple-m1 smoke disassembles the binary. macos-latest ships llvm-objdump
      # inside the Xcode toolchain, not on PATH. A wrapper keeps `xcrun` in
      # front of it so the existing llvm-objdump branch in check-aot-isa.sh runs.
      - name: Expose Xcode llvm-objdump
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          if ! dump="$(xcrun --find llvm-objdump 2>/dev/null)" || [ ! -x "$dump" ]; then
            echo "xcrun llvm-objdump not found; the ISA check will use otool" >&2
            command -v otool >/dev/null
            exit 0
          fi
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          printf '%s\n' '#!/bin/sh' 'exec xcrun llvm-objdump "$@"' > "${bindir}/llvm-objdump"
          chmod +x "${bindir}/llvm-objdump"
          echo "$bindir" >> "$GITHUB_PATH"
          "${bindir}/llvm-objdump" --version

      - name: Smoke the published binary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ISA: ${{ matrix.isa }}
          SKU: ${{ matrix.sku }}
        run: |
          set -euo pipefail
          if [ "$RID" = "win-x64" ]; then
            bin="artifacts/${SKU}/Magika.Cli.exe"
          else
            bin="artifacts/${SKU}/Magika.Cli"
            chmod +x "$bin"
          fi
          isa="$ISA"
          if [ "$isa" = "none" ]; then
            isa=""
          fi
          ./packaging/smoke-aot.sh "$bin" "$isa" tests/Magika.Tests/Fixtures/pdf.bin

      - name: Pack the release zip
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ISA: ${{ matrix.isa }}
          SKU: ${{ matrix.sku }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # bash 3.2 (macOS /bin/bash) errors on "${empty[@]}" under set -u.
          # Keep this array non-empty and append ISA only for avx2/avx512.
          cmd=(
            ./packaging/stage-release.sh
            "$RID"
            "$TAG"
            "artifacts/$SKU"
            "artifacts/release/magika-${TAG}-${SKU}.zip"
          )
          if [ -n "$ISA" ] && [ "$ISA" != "none" ]; then
            cmd+=("$ISA")
          fi
          "${cmd[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: magika-${{ matrix.sku }}
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [version, publish]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: magika-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          files=(
            "magika-${TAG}-linux-x64-avx2.zip"
            "magika-${TAG}-linux-x64-avx512.zip"
            "magika-${TAG}-win-x64-avx2.zip"
            "magika-${TAG}-win-x64-avx512.zip"
            "magika-${TAG}-osx-arm64.zip"
          )
          for file in "${files[@]}"; do
            test -f "dist/$file"
          done
          (
            cd dist
            sha256sum "${files[@]}" > SHA256SUMS.txt
          )
          ./packaging/release-notes.sh "$TAG" > dist/notes.md

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            "dist/magika-${TAG}-linux-x64-avx2.zip"
            "dist/magika-${TAG}-linux-x64-avx512.zip"
            "dist/magika-${TAG}-win-x64-avx2.zip"
            "dist/magika-${TAG}-win-x64-avx512.zip"
            "dist/magika-${TAG}-osx-arm64.zip"
            dist/SHA256SUMS.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file dist/notes.md
          else
            args=(release create "$TAG" "${assets[@]}" --target "${GITHUB_SHA}" --title "$TAG" --notes-file dist/notes.md)
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
